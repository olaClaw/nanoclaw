# Core services preview. Bootstrap and release selection are still in progress.
# The profile prevents an accidental `docker compose up` from starting it.
services:
  nanoclaw:
    profiles: [core-preview]
    image: ${NANOCLAW_HOST_IMAGE:?Set NANOCLAW_HOST_IMAGE to a reviewed image}
    depends_on:
      onecli-egress:
        condition: service_healthy
      signal-cli:
        condition: service_started
      infomaniak-mail:
        condition: service_healthy
      nextcloud-calendar:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    group_add:
      - ${DOCKER_SOCKET_GID:?Set DOCKER_SOCKET_GID for the Docker socket}
    environment:
      HOME: /home/node
      NANOCLAW_AGENT_ASSETS_IN_IMAGE: 'true'
      NANOCLAW_INSTALL_ID: ${NANOCLAW_INSTALL_ID:?Set NANOCLAW_INSTALL_ID}
      CONTAINER_IMAGE: ${NANOCLAW_AGENT_IMAGE:?Set NANOCLAW_AGENT_IMAGE from the same commit}
      NANOCLAW_HOST_IMAGE: ${NANOCLAW_HOST_IMAGE:?Set NANOCLAW_HOST_IMAGE from the release manifest}
      NANOCLAW_AGENT_IMAGE: ${NANOCLAW_AGENT_IMAGE:?Set NANOCLAW_AGENT_IMAGE from the release manifest}
      NANOCLAW_BROKER_IMAGE: ${NANOCLAW_BROKER_IMAGE:?Set NANOCLAW_BROKER_IMAGE from the release manifest}
      ONECLI_IMAGE: ${ONECLI_IMAGE:?Set ONECLI_IMAGE from the release manifest}
      POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE from the release manifest}
      SIGNAL_IMAGE: ${SIGNAL_IMAGE:?Set SIGNAL_IMAGE from the release manifest}
      NANOCLAW_RELEASE_MANIFEST: /srv/nanoclaw/release.json
      NANOCLAW_GATEWAY_PROVIDER: onecli
      NANOCLAW_EGRESS_LOCKDOWN: 'true'
      NANOCLAW_EGRESS_NETWORK: nanoclaw-egress
      ONECLI_GATEWAY_CONTAINER: onecli-egress
      ONECLI_URL: http://onecli:10255
      SIGNAL_MANAGE_DAEMON: 'false'
      SIGNAL_TCP_HOST: signal-cli
      SIGNAL_TCP_PORT: '7583'
      SIGNAL_DATA_DIR: /srv/nanoclaw/signal
      SIGNAL_ATTACHMENT_DIR: /srv/nanoclaw/signal-outbox
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: /srv/nanoclaw/data
        target: /srv/nanoclaw/data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/groups
        target: /srv/nanoclaw/groups
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/store
        target: /srv/nanoclaw/store
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/config
        target: /home/node/.config
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/templates
        target: /srv/nanoclaw/templates
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/signal/attachments
        target: /srv/nanoclaw/signal/attachments
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/signal-outbox
        target: /srv/nanoclaw/signal-outbox
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /srv/nanoclaw/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/release.json
        target: /srv/nanoclaw/release.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    networks: [gateway, channels]

  signal-cli:
    profiles: [core-preview]
    image: ${SIGNAL_IMAGE:?Set SIGNAL_IMAGE to a reviewed signal-cli image}
    # The official image already supplies the executable and --config path.
    command: [daemon, --tcp, '0.0.0.0:7583']
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - type: bind
        source: /srv/nanoclaw/signal
        target: /var/lib/signal-cli
        bind:
          create_host_path: false
      - type: bind
        source: /srv/nanoclaw/signal-outbox
        target: /srv/nanoclaw/signal-outbox
        read_only: true
        bind:
          create_host_path: false
    networks: [channels]

  postgres:
    profiles: [core-preview]
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the reviewed PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_USER: onecli
      POSTGRES_DB: onecli
      POSTGRES_PASSWORD_FILE: /run/secrets/onecli_db_password
    secrets: [onecli_db_password]
    volumes:
      - onecli-pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, onecli, -d, onecli]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks: [db]

  onecli:
    profiles: [core-preview]
    image: ${ONECLI_IMAGE:?Set ONECLI_IMAGE to a reviewed gateway image}
    container_name: onecli
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # OneCLI 1.43.3 needs DATABASE_URL, not a _FILE setting. Construct it
    # inside the container from a hex-only password file to keep the value out
    # of Compose interpolation, image metadata and configuration output.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        password=$$(cat /run/secrets/onecli_db_password)
        [ "$${#password}" -eq 64 ] || exit 1
        case "$$password" in *[!0-9a-fA-F]*) exit 1;; esac
        export DATABASE_URL="postgresql://onecli:$$password@postgres:5432/onecli"
        exec /sbin/tini -- /app/entrypoint.sh
    environment:
      APP_URL: http://127.0.0.1:10254
      GATEWAY_API_URL: http://127.0.0.1:10255
    secrets: [onecli_db_password]
    volumes:
      - onecli-data:/app/data
    ports:
      - '127.0.0.1:10254:10254'
    networks: [gateway, db]

  onecli-egress:
    profiles: [core-preview]
    image: ${NANOCLAW_HOST_IMAGE:?Set NANOCLAW_HOST_IMAGE to a reviewed image}
    container_name: onecli-egress
    command: [node, deploy/onecli-egress.mjs]
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      onecli:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, deploy/onecli-egress.mjs, --health]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [gateway, agent-egress]

  infomaniak-mail:
    profiles: [core-preview]
    image: ${NANOCLAW_BROKER_IMAGE:?Set NANOCLAW_BROKER_IMAGE from the same commit}
    command: [python, /app/infomaniak-mail.py, serve, --config, /run/private/mail.json]
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - type: bind
        source: ${INFOMANIAK_BROKER_CONFIG_FILE:?Set INFOMANIAK_BROKER_CONFIG_FILE outside Git}
        target: /run/private/mail.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INFOMANIAK_DOWNLOAD_DIR:?Set INFOMANIAK_DOWNLOAD_DIR outside Git}
        target: ${INFOMANIAK_DOWNLOAD_DIR:?Set INFOMANIAK_DOWNLOAD_DIR outside Git}
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/health', timeout=2).close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [broker-outbound, agent-egress]

  nextcloud-calendar:
    profiles: [core-preview]
    image: ${NANOCLAW_BROKER_IMAGE:?Set NANOCLAW_BROKER_IMAGE from the same commit}
    command: [python, /app/nextcloud-calendar.py, --config, /run/private/calendar.json]
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - type: bind
        source: ${NEXTCLOUD_BROKER_CONFIG_FILE:?Set NEXTCLOUD_BROKER_CONFIG_FILE outside Git}
        target: /run/private/calendar.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18766/health', timeout=2).close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [broker-outbound, agent-egress]

secrets:
  onecli_db_password:
    file: ${ONECLI_DB_PASSWORD_FILE:?Set ONECLI_DB_PASSWORD_FILE outside Git}

volumes:
  onecli-pgdata:
  onecli-data:

networks:
  gateway:
    driver: bridge
  db:
    internal: true
  channels:
    driver: bridge
  broker-outbound:
    driver: bridge
  agent-egress:
    name: nanoclaw-egress
    internal: true
